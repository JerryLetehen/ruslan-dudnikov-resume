name: Compile Resume

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  compile:
    name: Compile resume pdf
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Run the build process with Docker
        uses: addnab/docker-run-action@v3
        with:
          image: thomasweise/docker-texlive-full:latest
          options: -v ${{ github.workspace }}:/data
          run: |
            cd data
            pdflatex ruslan_dudnikov_resume.tex
            gs -sDEVICE=png16m -r150 -dTextAlphaBits=4 -dGraphicsAlphaBits=4 \
               -o resume_preview.png ruslan_dudnikov_resume.pdf
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: ruslan_dudnikov_resume.pdf
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply pdflatex changes
          file_pattern: ruslan_dudnikov_resume.pdf resume_preview.png
