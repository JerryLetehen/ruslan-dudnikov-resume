name: Compile Resume

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  compile:
    name: Compile resume and projects pdf
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Run the build process with Docker
        uses: addnab/docker-run-action@v3
        with:
          image: thomasweise/docker-texlive-full:latest
          options: -v ${{ github.workspace }}:/data
          run: |
            cd data
            # Resume (single page)
            pdflatex ruslan_dudnikov_resume.tex
            gs -sDEVICE=png16m -r150 -dTextAlphaBits=4 -dGraphicsAlphaBits=4 \
               -o resume_preview.png ruslan_dudnikov_resume.pdf
            # Projects (multi-page: compile twice for "Page X of Y")
            pdflatex ruslan_dudnikov_projects.tex
            pdflatex ruslan_dudnikov_projects.tex
      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: |
            ruslan_dudnikov_resume.pdf
            ruslan_dudnikov_projects.pdf
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply pdflatex changes
          file_pattern: ruslan_dudnikov_resume.pdf resume_preview.png ruslan_dudnikov_projects.pdf
